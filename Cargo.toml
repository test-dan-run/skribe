[workspace]
resolver = "3"
members = [
    "src-tauri",
    "crates/skribe-domain",
    "crates/skribe-store",
    "crates/skribe-ipc",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
skribe-domain = { path = "crates/skribe-domain" }
skribe-store = { path = "crates/skribe-store" }
skribe-ipc = { path = "crates/skribe-ipc" }

rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
ts-rs = "12"
uuid = { version = "1", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Command errors carry their full user-facing explanation and are serialised whole. They are
# returned a few times per user action, so their size is not worth boxing them for.
result_large_err = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
